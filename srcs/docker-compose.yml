version: '3.8'

services:
         nginx:
                container_name: nginx
                networks: 
                   - inception
                build:
                      context: requirements/nginx
                      dockerfile: Dockerfile
                ports:
                   - "443:443"
                env_file:
                   - .env
                restart: always
                depends_on:
                   - wordpress
                volumes:
                   - wordpress:/var/www/wordpress
         mariadb:
                container_name: mariadb
                env_file:
                   - .env
                networks: 
                   - inception
                build:
                       context: requirements/mariadb
                       dockerfile: Dockerfile
                restart: unless-stopped
                volumes:
                   - mariadb:/var/lib/mysql
                expose:
                   - "3306"
         wordpress:
                container_name: wordpress
                env_file:
                   - .env
                networks: 
                   - inception
                build:
                        context: requirements/wordpress
                        dockerfile: Dockerfile
                restart: on-failure
                volumes:
                   - wordpress:/var/www/wordpress
                depends_on:
                   - mariadb
volumes:
        mariadb:
                driver: local
                driver_opts:
                        type: none
                        device : /home/jbutte/data/mariadb
                        o: bind
        wordpress:
                driver: local
                driver_opts:
                        type: none
                        device : /home/jbutte/data/wordpress
                        o: bind
                        
networks:
    inception:
        driver: bridge
